<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2027 Election Winners & Runners-Up Dashboard</title>
<style>body{font-family:Arial;background:#f4f6f8;height:100vh;margin:0;display:grid;place-items:center}.box{width:min(390px,90vw);background:#fff;padding:30px;border-radius:14px;box-shadow:0 10px 30px #0001}input,button{width:100%;padding:12px;margin:7px 0;box-sizing:border-box;border:1px solid #ccd2d8;border-radius:8px}button{background:#111;color:#fff}.err{color:#b00020}</style></head>
<body><form class="box" method="post"><h2>2027 Election Winners & Runners-Up Dashboard</h2><p>Live leaders, runners-up and declared-complete winners across all six election contests.</p>{% if error %}<p class="err">{{error}}</p>{% endif %}<input name="username" placeholder="Username" required><input name="password" type="password" placeholder="Password" required><button>Sign in</button></form></body></html>
